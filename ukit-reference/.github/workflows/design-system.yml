# ──────────────────────────────────────────────────────────────────────────────
# design-system.yml — CI for @axioledger/axio-design-system
#
# Runs on every push / PR that touches packages/design-system/**
# Also runs on every push to main (for scheduled Storybook deployment).
# ──────────────────────────────────────────────────────────────────────────────
name: Design System CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/design-system/**'
      - '.github/workflows/design-system.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/design-system/**'
      - '.github/workflows/design-system.yml'

concurrency:
  group: ds-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: packages/design-system

jobs:
  # ── Type Check ───────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/design-system/package-lock.json
      - run: npm ci
      - run: npm run type-check

  # ── Unit Tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (Jest + Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/design-system/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage --forceExit
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: packages/design-system/coverage/
          retention-days: 7

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Library Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/design-system/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build tokens manifest
        run: node scripts/build-tokens.js
      - name: Check bundle size
        run: |
          SIZE=$(du -sk dist/index.js 2>/dev/null | cut -f1 || echo "0")
          echo "Bundle size: ${SIZE}KB"
          # Warn if > 200KB (before gzip)
          if [ "$SIZE" -gt 200 ]; then
            echo "::warning::Bundle size ${SIZE}KB exceeds 200KB target"
          fi
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: design-system-dist
          path: packages/design-system/dist/
          retention-days: 3

  # ── Storybook Build ──────────────────────────────────────────────────────────
  storybook:
    name: Storybook Build (a11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/design-system/package-lock.json
      - run: npm ci
      - run: npm run storybook:build
      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: packages/design-system/storybook-static/
          retention-days: 7

  # ── Publish (on tag v*.*.* for the package) ──────────────────────────────────
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [typecheck, test, build]
    if: startsWith(github.ref, 'refs/tags/design-system-v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@axioledger'
          cache: 'npm'
          cache-dependency-path: packages/design-system/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-tokens.js
      - name: Publish
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
