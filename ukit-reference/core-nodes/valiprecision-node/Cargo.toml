[package]
name = "valiprecision-node"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
description = "Valiprecision ($VPX) — Consensus Engine, P2P Network, Validator Client (~120k LOC)"

[[bin]]
name = "vpx-node"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "kad"] }
rocksdb = "0.21"

[dev-dependencies]
tokio-test = "0.4"
