[package]
name = "kpx-liquidity"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
description = "KinetoProtocol — AMM Router, Cross-chain Bridge, RWA Logic (~80k LOC)"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "1.18"
borsh = "1.5"
borsh-derive = "1.5"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
thiserror = "1.0"

[dev-dependencies]
solana-program-test = "1.18"
tokio = { version = "1", features = ["macros"] }
